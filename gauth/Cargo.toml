[package]
name = "gauth"
version = "0.1.0"
authors = ["Lawrence Feng <spnether1411@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = { version = "0.5.3", optional = true, features = ["std"] }
axum = { version = "0.8.7", optional = true }
dioxus = { version = "0.7.1", features = ["fullstack"] }
dotenv = "0.15.0"
reqwest = { version = "0.12.24", features = ["json"] }
rusqlite = { version = "0.37.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:rusqlite", "dep:argon2", "dep:tokio", "dep:axum"]
