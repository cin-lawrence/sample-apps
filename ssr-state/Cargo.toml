[package]
name = "ssr-state"
version = "0.1.0"
authors = ["Lawrence Feng <spnether1411@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.7", optional = true }
axum-core = "0.5.5"
dioxus = { version = "0.7.1", features = ["fullstack"] }
futures = { version = "0.3.31", optional = true }
reqwest = { version = "0.12.24", features = ["json"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls"], optional = true }
tokio = { version = "1.48.0", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:sqlx", "dep:tokio", "dep:axum", "dep:futures"]
